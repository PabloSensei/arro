[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
# GPL and AGPL stay out because the list is an allowlist: anything unlisted fails.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
# MPL-2.0, CC0-1.0 and BSL-1.0 are accepted crate by crate, never globally.
exceptions = [
    { allow = ["CC0-1.0"], crate = "notify" },
    { allow = ["MPL-2.0"], crate = "nucleo-matcher" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["BSL-1.0"], crate = "xxhash-rust" },
]

[licenses.private]
ignore = true

[advisories]
# Crates GPUI pulls in that nobody maintains now. No known vulnerability in any of them.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant, through GPUI" },
    { id = "RUSTSEC-2024-0436", reason = "paste, through GPUI" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, through GPUI" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, through GPUI" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
