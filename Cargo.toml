[workspace]
resolver = "3"
# Not "tools/*": tools/corpus and tools/measure are not workspace crates.
members = ["crates/*/*", "tools/xtask", "tools/lang-fixture", "tools/window-language"]
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.1.3"
edition = "2024"
publish = false

[workspace.dependencies]
base = { path = "crates/foundation/base" }
chardetng = "1"
container = { path = "crates/services/container" }
dap-client = { path = "crates/services/dap-client" }
encoding_rs = "0.8"
gpui-kit = "=0.9.0"
gpui_windows = { package = "gpui-pre-windows", version = "=0.3.11" }
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
java-exec = { path = "crates/java/java-exec" }
java-project = { path = "crates/java/java-project" }
jdtls-adapter = { path = "crates/java/jdtls-adapter" }
lang-api = { path = "crates/services/lang-api" }
lsp-client = { path = "crates/services/lsp-client" }
notify = "=9.0.0-rc.7"
nucleo-matcher = "0.3"
platform = { path = "crates/foundation/platform" }
plugin-host = { path = "crates/services/plugin-host" }
proc-sup = { path = "crates/foundation/proc-sup" }
project-model = { path = "crates/services/project-model" }
proptest = "1"
regex = "1"
ropey = "=2.0.0-beta.1"
runner = { path = "crates/services/runner" }
semantic-router = { path = "crates/services/semantic-router" }
sidecar = { path = "crates/services/sidecar" }
streaming-iterator = "0.1"
terminal = { path = "crates/services/terminal" }
tree-sitter = "0.27"
tree-sitter-dockerfile-updated = "=0.2.0"
tree-sitter-java-orchard = "=0.5.23"
updater = { path = "crates/services/updater" }
vcs = { path = "crates/services/vcs" }
workspace-core = { path = "crates/services/workspace-core" }

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
debug = "line-tables-only"

# `xtask symbolize` reads file:line from the pdb of the test binary, and the environment
# may build the dev profile without debug info. Both profiles need the same setting, or
# `cargo test` cannot relink the `xtask.exe` of a running `cargo xtask`.
[profile.dev.package.xtask]
debug = "line-tables-only"

[profile.test.package.xtask]
debug = "line-tables-only"
