[package]
name = "store"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
# Temporary folders of the tests: one root and removal without help from a test.
test-support = { path = "../../../tools/test-support" }
