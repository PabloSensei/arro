[package]
name = "java-project"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base.workspace = true
database.workspace = true
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
lang-api.workspace = true
platform.workspace = true
proc-sup.workspace = true
project-model.workspace = true
ring = "0.17"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
] }
zip = { version = "9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
# Temporary folders of the tests: one root and removal without help from a test.
test-support = { path = "../../../tools/test-support" }
