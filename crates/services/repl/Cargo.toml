[package]
name = "repl"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
proc-sup.workspace = true
serde_json = "1"

[dev-dependencies]
# The process table, to see that a helper is gone after its session.
platform.workspace = true

[[bin]]
# A stand-in for the helper in tests, so that a machine without a runtime runs them.
name = "repl-fake-helper"
path = "src/bin/fake_helper.rs"
test = false
doc = false
