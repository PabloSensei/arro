[package]
name = "kube"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base.workspace = true
proc-sup.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Temporary folders of the tests: one root and removal without help from a test.
test-support = { path = "../../../tools/test-support" }

[[bin]]
# A stand-in for the kubectl CLI in the tests, for machines without a cluster.
name = "kube-fake-kubectl"
path = "src/bin/fake_kubectl.rs"
test = false
doc = false
