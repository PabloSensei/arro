[package]
name = "updater"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
platform.workspace = true
# Ed25519 signatures of a release. The license is Apache-2.0 AND ISC, both allowed by
# deny.toml; the crate is already in the tree through the TLS stack of ureq.
ring = "0.17"
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
] }
zip = { version = "9", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }

[dev-dependencies]
# Temporary folders of the tests: one root and removal without help from a test.
test-support = { path = "../../../tools/test-support" }
