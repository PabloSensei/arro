[package]
name = "database"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base.workspace = true
platform.workspace = true
proc-sup.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Temporary folders of the tests: one root and removal without help from a test.
test-support = { path = "../../../tools/test-support" }

[[bin]]
# A stand-in for the helper in tests, so that a machine without a driver runs them.
name = "database-fake-helper"
path = "src/bin/fake_helper.rs"
test = false
doc = false
