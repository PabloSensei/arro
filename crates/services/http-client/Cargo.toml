[package]
name = "http-client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "_ring",
    "platform-verifier",
] }

[dev-dependencies]
# Temporary folders of the tests: one root and removal without help from a test.
test-support = { path = "../../../tools/test-support" }
