# Single source of budget values, see docs/ARCHITECTURE.md section 6.
# All values are targets, not measurements.
#
# target        exceeding it produces a warning
# limit         exceeding it fails the build
# applies_from  first stage where the metric is enforced
# pending       spike that sets the value; used instead of target and limit
# observe       recorded in the report, never fails the build; takes no values

