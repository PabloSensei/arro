# Builds the Linux and macOS archives, attaches them to the draft release that
# team/release.sh made with the Windows archive, checks the whole set and only then
# publishes the release: nobody can download a release without its archives.
# Without a tag the run is a trial: the Linux archive becomes an artifact of the run.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of the draft release, v0.1.12 for one; empty for a trial"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The pinned language tools. `xtask dist` checks the SHA-256 of both files, so a
  # different file stops the job instead of shipping another server.
  JDTLS_ARCHIVE: jdt-language-server-1.63.0-202610191322.tar.gz
  JDTLS_URL: https://download.eclipse.org/jdtls/snapshots/jdt-language-server-1.63.0-202610191322.tar.gz
  DEBUG_ARCHIVE: vscjava.vscode-java-debug-0.60.0.vsix
  DEBUG_URL: https://open-vsx.org/api/vscjava/vscode-java-debug/0.60.0/file/vscjava.vscode-java-debug-0.60.0.vsix
  TAG: ${{ inputs.tag }}

jobs:
  linux:
    name: Linux archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Language tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools/download-jdtls" "$RUNNER_TEMP/tools/download-java-debug"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-jdtls/$JDTLS_ARCHIVE" "$JDTLS_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-java-debug/$DEBUG_ARCHIVE" "$DEBUG_URL"

      # The binary links against the glibc of the system it is built on, and a newer
      # glibc does not start on an older one. The archive is built in Ubuntu 22.04
      # (glibc 2.35), so it runs on Ubuntu 22.04, Debian 12 and anything newer, whatever
      # system the runner itself has.
      - name: Archive and checksum
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="trial-${GITHUB_SHA::7}"
          fi
          name="arro-$version-linux-x86_64"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dist"
          # The helper jars compile against the libraries of Maven 3.9; the runner has
          # one, Ubuntu 22.04 only an older Maven, so the runner's goes in read-only.
          maven_home=$(dirname "$(dirname "$(readlink -f "$(command -v mvn)")")")
          echo "Maven of the runner: $maven_home"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP:/work" -w /src \
            -v "$maven_home:/opt/maven:ro" -e MAVEN_HOME=/opt/maven \
            -e NAME="$name" -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential binutils ca-certificates cmake curl git pkg-config unzip \
                openjdk-17-jdk-headless \
                libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev \
                libxkbcommon-dev libxkbcommon-x11-dev > /dev/null
              git config --global --add safe.directory /src
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              . "$HOME/.cargo/env"
              cargo run -q -p xtask -- dist --target linux \
                --out "/work/dist/$NAME" --tools /work/tools --zip
              # The newest glibc the program asks for; anything past 2.35 would shut
              # out the systems this build is for.
              newest=$(objdump -T "/work/dist/$NAME/arro" | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1)
              echo "newest glibc symbol: $newest"
              [ "$( { echo "$newest"; echo GLIBC_2.35; } | sort -V | tail -1)" = GLIBC_2.35 ]
              chown -R "$(stat -c %u:%g /src)" /work/dist /src/target
            '
          cd "$RUNNER_TEMP/dist"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - name: Attach to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/dist/"arro-*.tar.gz \
            "$RUNNER_TEMP/dist/"arro-*.tar.gz.sha256 \
            --clobber

      - name: Keep the trial archive
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ runner.temp }}/dist/arro-*.tar.gz
            ${{ runner.temp }}/dist/arro-*.tar.gz.sha256
          retention-days: 7

  macos:
    name: macOS archive
    # Only for a release: a trial run checks the Linux build alone.
    if: inputs.tag != ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Language tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools/download-jdtls" "$RUNNER_TEMP/tools/download-java-debug"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-jdtls/$JDTLS_ARCHIVE" "$JDTLS_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-java-debug/$DEBUG_ARCHIVE" "$DEBUG_URL"

      # The runner is Apple silicon. `xtask dist --target macos` names the archive after
      # the machine it built on, `macos-aarch64` here and `macos-x86_64` on an Intel Mac.
      - name: Archive and checksum
        run: |
          version="${TAG#v}"
          case "$(uname -m)" in
            arm64) platform=macos-aarch64 ;;
            x86_64) platform=macos-x86_64 ;;
            *) echo "no macOS release for $(uname -m)" >&2; exit 1 ;;
          esac
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          cargo run -q -p xtask -- dist --target macos --out "$out" \
            --tools "$RUNNER_TEMP/tools" --zip
          cd "$out"
          shasum -a 256 "arro-$version-$platform.zip" > "arro-$version-$platform.zip.sha256"
          cat "arro-$version-$platform.zip.sha256"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/dist/"arro-*.zip \
            "$RUNNER_TEMP/dist/"arro-*.zip.sha256 \
            --clobber

  # The draft becomes public only when every archive is there and matches its checksum,
  # the Linux program asks for no glibc past 2.35 and each archive holds its program.
  publish:
    name: Check and publish
    needs: [linux, macos]
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          mkdir -p "$RUNNER_TEMP/check" && cd "$RUNNER_TEMP/check"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          for archive in \
            "arro-$version-windows-x86_64.zip" \
            "arro-$version-linux-x86_64.tar.gz" \
            "arro-$version-macos-aarch64.zip"; do
            [ -f "$archive" ] || { echo "missing $archive"; exit 1; }
            [ -f "$archive.sha256" ] || { echo "missing $archive.sha256"; exit 1; }
            expected=$(cut -d' ' -f1 "$archive.sha256")
            actual=$(sha256sum "$archive" | cut -d' ' -f1)
            [ "$expected" = "$actual" ] || { echo "the checksum of $archive differs"; exit 1; }
            echo "ok $archive"
          done
          tar -xzf "arro-$version-linux-x86_64.tar.gz"
          program="arro-$version-linux-x86_64/arro"
          [ -x "$program" ] || { echo "the Linux archive has no arro"; exit 1; }
          newest=$(objdump -T "$program" | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$( { echo "$newest"; echo GLIBC_2.35; } | sort -V | tail -1)" = GLIBC_2.35 ]
          unzip -l "arro-$version-macos-aarch64.zip" | grep -q "Arro.app/Contents/MacOS/" \
            || { echo "the macOS archive has no Arro.app"; exit 1; }
          unzip -l "arro-$version-windows-x86_64.zip" | grep -q "arro.exe" \
            || { echo "the Windows archive has no arro.exe"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
