# Builds the Linux and macOS archives and attaches them to a published release. The
# Windows archive comes from the release script, built and tested on the maintainer's
# machine, and is not replaced here.
name: release

on:
  release:
    types: [published]
  # A trial build without a release: the archives become artifacts of the run.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The pinned language tools. `xtask dist` checks the SHA-256 of both files, so a
  # different file stops the job instead of shipping another server.
  JDTLS_ARCHIVE: jdt-language-server-1.63.0-202610191322.tar.gz
  JDTLS_URL: https://download.eclipse.org/jdtls/snapshots/jdt-language-server-1.63.0-202610191322.tar.gz
  DEBUG_ARCHIVE: vscjava.vscode-java-debug-0.60.0.vsix
  DEBUG_URL: https://open-vsx.org/api/vscjava/vscode-java-debug/0.60.0/file/vscjava.vscode-java-debug-0.60.0.vsix

jobs:
  linux:
    name: Linux archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Language tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools/download-jdtls" "$RUNNER_TEMP/tools/download-java-debug"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-jdtls/$JDTLS_ARCHIVE" "$JDTLS_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-java-debug/$DEBUG_ARCHIVE" "$DEBUG_URL"

      # The binary links against the glibc of the system it is built on, and a newer
      # glibc does not start on an older one. The archive is built in Ubuntu 22.04
      # (glibc 2.35), so it runs on Ubuntu 22.04, Debian 12 and anything newer, whatever
      # system the runner itself has.
      - name: Archive and checksum
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="trial-${GITHUB_SHA::7}"
          fi
          name="arro-$version-linux-x86_64"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dist"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP:/work" -w /src \
            -e NAME="$name" -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                build-essential binutils ca-certificates cmake curl git pkg-config unzip \
                libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev \
                libxkbcommon-dev libxkbcommon-x11-dev > /dev/null
              git config --global --add safe.directory /src
              curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
              . "$HOME/.cargo/env"
              cargo run -q -p xtask -- dist --target linux \
                --out "/work/dist/$NAME" --tools /work/tools --zip
              # The newest glibc the program asks for; anything past 2.35 would shut
              # out the systems this build is for.
              newest=$(objdump -T "/work/dist/$NAME/arro" | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -1)
              echo "newest glibc symbol: $newest"
              [ "$( { echo "$newest"; echo GLIBC_2.35; } | sort -V | tail -1)" = GLIBC_2.35 ]
              chown -R "$(stat -c %u:%g /src)" /work/dist /src/target
            '
          cd "$RUNNER_TEMP/dist"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME"             "$RUNNER_TEMP/dist/"arro-*.tar.gz             "$RUNNER_TEMP/dist/"arro-*.tar.gz.sha256             --clobber

      - name: Keep the trial archive
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ runner.temp }}/dist/arro-*.tar.gz
            ${{ runner.temp }}/dist/arro-*.tar.gz.sha256
          retention-days: 7

  macos:
    name: macOS archive
    # Only for a release: a trial run checks the Linux build alone.
    if: github.event_name == 'release'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Language tools
        run: |
          mkdir -p "$RUNNER_TEMP/tools/download-jdtls" "$RUNNER_TEMP/tools/download-java-debug"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-jdtls/$JDTLS_ARCHIVE" "$JDTLS_URL"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tools/download-java-debug/$DEBUG_ARCHIVE" "$DEBUG_URL"

      # The runner is Apple silicon. `xtask dist --target macos` names the archive after
      # the machine it built on, `macos-aarch64` here and `macos-x86_64` on an Intel Mac.
      - name: Archive and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$(uname -m)" in
            arm64) platform=macos-aarch64 ;;
            x86_64) platform=macos-x86_64 ;;
            *) echo "no macOS release for $(uname -m)" >&2; exit 1 ;;
          esac
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          cargo run -q -p xtask -- dist --target macos --out "$out" \
            --tools "$RUNNER_TEMP/tools" --zip
          archive="$out/arro-$version-$platform.zip"
          cd "$out"
          shasum -a 256 "arro-$version-$platform.zip" > "arro-$version-$platform.zip.sha256"
          cat "arro-$version-$platform.zip.sha256"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dist/"arro-*.zip \
            "$RUNNER_TEMP/dist/"arro-*.zip.sha256 \
            --clobber
