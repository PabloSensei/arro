# Builds and tests Arro on the three systems the project supports. No secrets, no
# publishing: the release archives are made by hand with `cargo xtask dist`.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # GPUI draws through Wayland or X11 with fontconfig and xkbcommon, which the
      # runner does not carry by default.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      # Every window test watches its project folder, and one test process opens hundreds
      # of windows; the runner allows 128 inotify instances per user.
      - name: Linux inotify limits
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288

      # The toolchain, its components and its targets come from rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The license tests of xtask run cargo-deny on Windows.
      - name: cargo-deny
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Windows runner names its temporary folder in the short 8.3 form (RUNNER~1),
      # while the paths the program reads back are long; the tests compare both.
      - name: Tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --workspace --no-fail-fast

  # A real language server and a real debug adapter that are neither the ones the
  # product ships nor for its language: the neutral clients must not hide a dependency
  # on it. Both packages are test tools, not part of the build.
  boundary:
    name: Boundary (real servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      # The runner carries a Python it refuses to install into, so the tools live in a
      # folder of the job and disappear with it.
      - name: Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/boundary-venv"
          "$RUNNER_TEMP/boundary-venv/bin/pip" install --disable-pip-version-check \
            "python-lsp-server[pyflakes]==1.12.0" \
            "debugpy==1.8.14"

      - name: Language server boundary
        env:
          ARRO_PYLSP: ${{ runner.temp }}/boundary-venv/bin/pylsp
        run: cargo test -p lsp-client --test real_python -- --ignored

      - name: Debug adapter boundary
        env:
          ARRO_DEBUGPY_PYTHON: ${{ runner.temp }}/boundary-venv/bin/python
        run: cargo test -p dap-client --test real_debugpy -- --ignored
