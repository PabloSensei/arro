# Builds and tests Arro on the three systems the project supports. No secrets, no
# publishing: the release archives are made by hand with `cargo xtask dist`.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # GPUI draws through Wayland or X11 with fontconfig and xkbcommon, which the
      # runner does not carry by default.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      # Every window test watches its project folder, and one test process opens hundreds
      # of windows; the runner allows 128 inotify instances per user.
      - name: Linux inotify limits
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288

      # The toolchain, its components and its targets come from rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The license tests of xtask run cargo-deny on Windows.
      - name: cargo-deny
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Windows runner names its temporary folder in the short 8.3 form (RUNNER~1),
      # while the paths the program reads back are long; the tests compare both.
      - name: Tests
        if: runner.os != 'macOS'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --workspace --no-fail-fast

      # One test process of the panels opens hundreds of windows, and late in the run
      # macOS no longer starts an FSEvents stream for a new watcher. The tests that need
      # the file watcher run in a process of their own.
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo test --workspace --no-fail-fast -- \
            --skip window_tests_m11::a_new_and_a_removed_build_file_reach_the_language \
            --skip window_tests_tool_resize::a_new_build_file_in_a_subfolder_imports_the_project_again \
            --skip window_tests_ui::reload_and_autosave_take_and_write_the_disk_text \
            --skip window_tests_templates_settings::a_templates_file_written_on_disk_reaches_the_editor
          cargo test -p panels --lib -- \
            window_tests_m11::a_new_and_a_removed_build_file_reach_the_language \
            window_tests_tool_resize::a_new_build_file_in_a_subfolder_imports_the_project_again \
            window_tests_ui::reload_and_autosave_take_and_write_the_disk_text \
            window_tests_templates_settings::a_templates_file_written_on_disk_reaches_the_editor
