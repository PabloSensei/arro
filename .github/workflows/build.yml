# Builds and tests Arro on the three systems the project supports. No secrets, no
# publishing: the release archives are made by hand with `cargo xtask dist`.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # GPUI draws through Wayland or X11 with fontconfig and xkbcommon, which the
      # runner does not carry by default.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      # Every window test watches its project folder, and one test process opens hundreds
      # of windows; the runner allows 128 inotify instances per user.
      - name: Linux inotify limits
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w fs.inotify.max_user_instances=8192
          sudo sysctl -w fs.inotify.max_user_watches=524288

      # The toolchain, its components and its targets come from rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain && cargo --version

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The license tests of xtask run cargo-deny on Windows.
      - name: cargo-deny
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The Windows runner names its temporary folder in the short 8.3 form (RUNNER~1),
      # while the paths the program reads back are long; the tests compare both.
      - name: Tests
        if: runner.os != 'macOS'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --workspace --no-fail-fast

      # The windows of the panel tests are not released until their process ends, and
      # after several hundred of them macOS no longer starts an FSEvents stream for a new
      # file watcher. The panel tests run in six processes, each with a sixth of the list.
      - name: Tests (macOS)
        if: runner.os == 'macOS'
        run: |
          status=0
          cargo test --workspace --exclude panels --no-fail-fast || status=1
          list="$RUNNER_TEMP/panels-tests.txt"
          cargo test -p panels --lib -- --list --format terse | sed -n 's/: test$//p' > "$list"
          echo "$(wc -l < "$list") panel tests"
          awk -v dir="$RUNNER_TEMP" '{ print > (dir "/panels-shard-" (NR % 6)) }' "$list"
          for shard in "$RUNNER_TEMP"/panels-shard-*; do
            xargs cargo test -p panels --lib -- --exact < "$shard" || status=1
          done
          exit $status
